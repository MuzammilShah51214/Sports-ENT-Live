    <style>
        /* ----- GLOBAL DARK MODE ----- */
        :root {
            --bg-black: #000000;
            --panel-bg: #0c0c0c;
            --card-bg: #1a1a1a;
            --accent: #ff0000;
            --text-color: #e0e0e0;
            --player-height-mobile: 230px;
            --player-height-desktop: 400px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            font-family: 'Segoe UI', Roboto, sans-serif;
            color: var(--text-color);
            overflow-x: hidden;
        }

        /* ===== FIXED TRIPLE PLAYER – TOP 0 ===== */
        .dual-player-fixed {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 2000;
            background: #000;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 20px rgba(255,0,0,0.2);
        }

        /* ----- SHAKA CONTAINER ----- */
        .shaka-video-container {
            width: 100%;
            height: 0;
            background: #000;
            position: relative;
            transition: height 0.25s ease;
            overflow: hidden;
        }
        .shaka-video-container.active {
            height: var(--player-height-mobile);
        }
        @media (min-width: 768px) {
            .shaka-video-container.active { height: var(--player-height-desktop); }
        }

        /* ----- MODERN PLAYER WRAPPER ----- */
        .modern-player-wrapper {
            width: 100%;
            height: 0;
            background: #000;
            transition: height 0.25s ease;
            overflow: hidden;
            position: relative;
        }
        .modern-player-wrapper.active {
            height: var(--player-height-mobile);
        }
        @media (min-width: 768px) {
            .modern-player-wrapper.active { height: var(--player-height-desktop); }
        }

        /* ----- IFRAME PLAYER WRAPPER ----- */
        .iframe-player-wrapper {
            width: 100%;
            height: 0;
            background: #000;
            transition: height 0.25s ease;
            overflow: hidden;
            position: relative;
        }
        .iframe-player-wrapper.active {
            height: var(--player-height-mobile);
        }
        @media (min-width: 768px) {
            .iframe-player-wrapper.active { height: var(--player-height-desktop); }
        }

        .iframe-container {
            width: 100%;
            height: 100%;
            background: #000;
            position: relative;
        }
        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
            background: #000;
        }

        video {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain;
            background: #000;
        }

        /* ===== MODERN PLAYER CUSTOM STYLES ===== */
        .video-container {
            width: 100%;
            height: 100%;
            position: relative;
            background: #000;
            overflow: hidden;
            border-radius: 0;
            aspect-ratio: 16 / 9;
        }

        .video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            background: #000;
        }

        .fast-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: var(--accent);
            color: white;
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 15;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            letter-spacing: 0.5px;
        }
        .fast-badge::before {
            content: '';
            display: block;
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.1); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* ----- MODERN CONTROLS ----- */
        .controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.85));
            padding: 18px 22px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transform: translateY(0);
            transition: transform 0.3s ease, opacity 0.3s ease, visibility 0.3s ease;
            backdrop-filter: blur(4px);
            opacity: 1;
            visibility: visible;
            z-index: 20;
        }
        .controls.hidden-controls {
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px);
            pointer-events: none;
        }
        .video-container:hover .controls,
        .video-container:focus-within .controls {
            opacity: 1 !important;
            visibility: visible !important;
            transform: translateY(0) !important;
            pointer-events: auto !important;
        }

        .progress-container {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            cursor: pointer;
        }
        .progress {
            height: 100%;
            background: var(--accent);
            border-radius: 10px;
            width: 0%;
            position: relative;
        }
        .buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .left-controls, .right-controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .control-btn {
            background: transparent;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            transition: transform 0.2s;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        .control-btn:hover {
            background: rgba(255,255,255,0.1);
        }
        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .volume-slider {
            width: 90px;
            height: 5px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255,255,255,0.25);
            border-radius: 5px;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
        }
        .time {
            font-size: 15px;
            color: #f0f0f0;
            font-weight: 500;
            padding: 4px 10px;
            border-radius: 30px;
            background: rgba(0,0,0,0.3);
        }
        
        .settings-menu {
            position: absolute;
            bottom: 70px;
            right: 20px;
            background: rgba(15,15,20,0.95);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 8px;
            width: 180px;
            transform: translateY(15px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.25s;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 30;
            max-height: 300px;
            overflow-y: auto;
        }
        .settings-menu.active {
            transform: translateY(0);
            opacity: 1;
            visibility: visible;
        }
        .settings-menu button {
            width: 100%;
            padding: 10px;
            background: transparent;
            border: none;
            color: white;
            text-align: left;
            cursor: pointer;
            border-radius: 8px;
        }
        .settings-menu button:hover {
            background: rgba(255,0,0,0.2);
        }
        .settings-menu button.active-quality {
            background: var(--accent);
            color: white;
        }

        /* ===== BUFFERING INDICATOR (Modern Player) ===== */
        .buffering-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 15px 25px;
            border-radius: 50px;
            font-size: 16px;
            display: none;
            align-items: center;
            gap: 12px;
            z-index: 100;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,0,0,0.3);
            box-shadow: 0 0 20px rgba(255,0,0,0.2);
        }
        .buffering-indicator i {
            color: var(--accent);
            font-size: 22px;
        }

        /* ===== LOADER FOR IFRAME ===== */
        .iframe-loader {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2500;
            backdrop-filter: blur(5px);
            transition: opacity 0.3s ease;
            flex-direction: column;
            gap: 15px;
        }
        .iframe-loader.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loader-ring {
            width: 60px;
            height: 60px;
            border: 4px solid #333;
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s infinite linear;
        }
        .loader-text {
            color: #fff;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ----- CHANNEL CARDS (identical style) ----- */
        .sticky-filters {
            position: fixed;
            width: 100%;
            background: rgba(10,10,10,0.98);
            z-index: 999;
            padding: 15px 10px;
            display: flex;
            gap: 12px;
            overflow-x: auto;
            scrollbar-width: none;
            border-bottom: 1px solid #1a1a1a;
            transition: top 0.3s ease;
            backdrop-filter: blur(10px);
            top: 0;
        }
        .sticky-filters.with-player {
            top: var(--player-height-mobile);
        }
        @media (min-width: 768px) {
            .sticky-filters.with-player {
                top: var(--player-height-desktop);
            }
        }
        
        .filter-btn {
            padding: 10px 22px;
            border: none;
            border-radius: 20px;
            background: var(--card-bg);
            color: #888;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
            box-shadow: 4px 4px 8px #000, -2px -2px 6px #2d2d2d;
            white-space: nowrap;
            transition: 0.3s;
            text-transform: uppercase;
        }
        .filter-btn.active-filter {
            box-shadow: inset 3px 3px 6px #000, inset -1px -1px 4px #444;
            color: var(--accent);
            border: 1px solid rgba(255,0,0,0.3);
        }

        .tv-guide-section {
            padding: 10px 15px 30px;
            margin-top: 60px; /* Default for no player */
            transition: margin-top 0.3s ease;
        }
        .tv-guide-section.with-player {
            margin-top: calc(60px + var(--player-height-mobile));
        }
        @media (min-width: 768px) {
            .tv-guide-section.with-player {
                margin-top: calc(60px + var(--player-height-desktop));
            }
        }
        
        .tv-panel {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            background: var(--panel-bg);
            border-radius: 30px;
            padding: 20px;
            box-shadow: 10px 10px 20px #000;
        }
        .scroll-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        @media (min-width: 600px) {
            .scroll-container { grid-template-columns: repeat(3, 1fr); }
        }

        .channel-card {
            background: var(--card-bg);

            border-radius: 20px;
            padding: 15px 10px;

            display: flex;
            flex-direction: column;
            align-items: center;

        .ch-title { font-size: 10px; font-weight: 700; color: #bbb; text-align: center; text-transform: uppercase; }

    // ========== LAYOUT ADJUSTMENT FUNCTIONS ==========
    function adjustLayoutForActivePlayer() {
        const filters = document.getElementById('stickyFilters');
        const guide = document.getElementById('tvGuideSection');
        
        if (currentActivePlayer) {
            filters.classList.add('with-player');
            guide.classList.add('with-player');
        } else {
            filters.classList.remove('with-player');
            guide.classList.remove('with-player');
        }
    }

    function adjustLayoutForNoPlayer() {
        const filters = document.getElementById('stickyFilters');
        const guide = document.getElementById('tvGuideSection');
        
        filters.classList.remove('with-player');
        guide.classList.remove('with-player');
    }

    // ========== CORE FUNCTIONS ==========

    async function initShaka() {
        video = document.getElementById('video');
        container = document.getElementById('mainContainer');
        loader = document.getElementById('loader');
        shaka.polyfill.installAll();
        if (shaka.Player.isBrowserSupported()) {
            shakaPlayer = new shaka.Player(video);
            ui = new shaka.ui.Overlay(shakaPlayer, container, video);
        }
    }

    function hideAllPlayers() {
        if (shakaPlayer) shakaPlayer.unload();
        document.getElementById('mainContainer').classList.remove('active');

        if (modernVideo) {
            modernVideo.pause();
            modernVideo.src = "";
            modernVideo.load();
        }
        document.getElementById('modernPlayerWrapper').classList.remove('active');

        if (iframeEl) iframeEl.src = "";
        document.getElementById('iframePlayerWrapper').classList.remove('active');

        currentActivePlayer = null;
        adjustLayoutForNoPlayer();
    }

    async function loadShakaStream(server) {
        hideAllPlayers();
        try {
            if (!shakaPlayer) await initShaka();
            document.getElementById('mainContainer').classList.add('active');
            shakaPlayer.configure({ drm: { clearKeys: {} } });
            if (server.kid && server.key) {
                let ck = {}; 
                ck[server.kid.replace(/-/g, '').trim()] = server.key.replace(/-/g, '').trim();
                shakaPlayer.configure({ drm: { clearKeys: ck } });
            }
            if (loader) loader.style.display = 'flex';
            await shakaPlayer.load(server.url);
            video.play();
            if (loader) loader.style.display = 'none';
            currentActivePlayer = 'shaka';
            adjustLayoutForActivePlayer();
        } catch (e) { 
            console.error("Shaka Error:", e);
            if (loader) loader.style.display = 'none';
        }
    }

    function switchToModern(url) {
        hideAllPlayers();
        document.getElementById('modernPlayerWrapper').classList.add('active');
        modernVideo.src = url;
        modernVideo.play();
        currentActivePlayer = 'modern';
        adjustLayoutForActivePlayer();
    }

    function switchToIframe(url) {
        hideAllPlayers();
        document.getElementById('iframePlayerWrapper').classList.add('active');
        if (iframeLoader) iframeLoader.style.display = 'flex';
        iframeEl.src = url;
        currentActivePlayer = 'iframe';
        adjustLayoutForActivePlayer();
    }

    // ========== MODERN PLAYER INITIALIZATION ==========

    function initModernPlayer() {
        modernPlayerWrapper = document.getElementById('modernPlayerWrapper');
        modernVideo = document.getElementById('modernVideo');
        modernControls = document.querySelector('.modern-player-wrapper .controls');
        modernBufferingEl = document.getElementById('modernBuffering');
        modernPlayBtn = document.querySelector('.modern-player-wrapper .play-btn');
        modernProgress = document.querySelector('.modern-player-wrapper .progress');
        modernTime = document.querySelector('.modern-player-wrapper .time');
        
        // Fixed selectors for volume and quality controls
        modernMuteBtn = document.querySelector('.modern-player-wrapper .volume-btn');
        modernVolumeSlider = document.querySelector('.modern-player-wrapper .volume-slider');
        modernSettingsBtn = document.querySelector('.modern-player-wrapper .settings-btn');
        modernQualityList = document.getElementById('qualityList');

        if (!modernVideo) return;

        // Play/Pause
        modernPlayBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            modernVideo.paused ? modernVideo.play() : modernVideo.pause();
        });

        // Mute/Unmute Logic - FIXED
        if(modernMuteBtn) {
            modernMuteBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                modernVideo.muted = !modernVideo.muted;
                updateVolumeIcon();
            });
        }

        // Volume Slider - FIXED
        if(modernVolumeSlider) {
            modernVolumeSlider.addEventListener('input', (e) => {
                modernVideo.volume = parseFloat(e.target.value);
                modernVideo.muted = (modernVideo.volume === 0);
                updateVolumeIcon();
            });
        }

        // Update volume icon function
        function updateVolumeIcon() {
            if (modernMuteBtn) {
                if (modernVideo.muted || modernVideo.volume === 0) {
                    modernMuteBtn.innerHTML = '<i class="fas fa-volume-mute"></i>';
                } else if (modernVideo.volume < 0.5) {
                    modernMuteBtn.innerHTML = '<i class="fas fa-volume-down"></i>';
                } else {
                    modernMuteBtn.innerHTML = '<i class="fas fa-volume-up"></i>';
                }
            }
        }

        // Quality List Toggle - FIXED
        if(modernSettingsBtn) {
            modernSettingsBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                modernQualityList.classList.toggle('active');
            });
        }

        // Hide Quality list on click outside
        document.addEventListener('click', (e) => {
            if (!modernSettingsBtn?.contains(e.target) && !modernQualityList?.contains(e.target)) {
                if (modernQualityList) modernQualityList.classList.remove('active');
            }
        });

        // Quality selection
        if (modernQualityList) {
            modernQualityList.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    modernQualityList.querySelectorAll('button').forEach(b => b.classList.remove('active-quality'));
                    btn.classList.add('active-quality');
                    // Here you would implement actual quality switching
                    console.log('Quality selected:', btn.dataset.quality);
                });
            });
        }

        modernPlayerWrapper.addEventListener('click', (e) => {
            if (e.target.closest('.play-btn') || e.target.closest('.progress-container') || e.target.closest('.right-controls') || e.target.closest('.volume-container')) return;
            modernControls.classList.contains('hidden-controls') ? showModernControls() : hideModernControls();
        });

        modernVideo.addEventListener('playing', () => {
            modernBufferingEl.style.display = 'none';
            modernPlayBtn.innerHTML = '<i class="fas fa-pause"></i>';
            startModernHideTimer();
        });

        modernVideo.addEventListener('pause', () => {
            modernPlayBtn.innerHTML = '<i class="fas fa-play"></i>';
            showModernControls();
            cancelModernHideTimer();
        });

        modernVideo.addEventListener('waiting', () => { 
            modernBufferingEl.style.display = 'flex'; 
        });
        
        modernVideo.addEventListener('timeupdate', updateModernProgress);
        
        // Fullscreen
        const fullscreenBtn = document.querySelector('.modern-player-wrapper .fullscreen-btn');
        if (fullscreenBtn) {
            fullscreenBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (modernVideo.requestFullscreen) {
                    modernVideo.requestFullscreen();
                } else if (modernVideo.webkitRequestFullscreen) {
                    modernVideo.webkitRequestFullscreen();
                } else if (modernVideo.msRequestFullscreen) {
                    modernVideo.msRequestFullscreen();
                }
            });
        }
    }

    // ========== UTILS ==========

    function showModernControls() {
        modernControls.classList.remove('hidden-controls');
        if (!modernVideo.paused) startModernHideTimer();
    }

    function hideModernControls() {
        modernControls.classList.add('hidden-controls');
        cancelModernHideTimer();
    }

    function startModernHideTimer() {
        cancelModernHideTimer();
        modernHideTimer = setTimeout(() => {
            if (!modernVideo.paused) modernControls.classList.add('hidden-controls');
        }, 3000);
    }

    function cancelModernHideTimer() {
        if (modernHideTimer) clearTimeout(modernHideTimer);
    }

    function updateModernProgress() {
        if (modernVideo.duration) {
            modernProgress.style.width = `${(modernVideo.currentTime / modernVideo.duration) * 100}%`;
            const f = (t) => `${Math.floor(t / 60)}:${Math.floor(t % 60).toString().padStart(2, '0')}`;
            modernTime.textContent = `${f(modernVideo.currentTime)} / ${f(modernVideo.duration)}`;
        }
    }

    function openChannelModal(ch) {
        const sList = document.getElementById('serverList');
        sList.innerHTML = '';
        ch.servers.forEach(s => {
            const b = document.createElement('button');
            b.className = 'channel-card'; 
            b.style.width = "100%";
            b.style.margin = "0";
            b.textContent = s.name;
            b.onclick = () => {
                closeModal();
                if (s.player === 'shaka') loadShakaStream(s);
                else if (s.player === 'modern') switchToModern(s.url);
                else if (s.player === 'iframe') switchToIframe(s.url);
            };
            sList.appendChild(b);
        });
        document.getElementById('serverModal').style.display = 'flex';
    }

    function loadChannels() {
        const list = document.getElementById('channelList');
        list.innerHTML = '';
        channelsData.forEach(ch => {
            const card = document.createElement('button');
            card.className = 'channel-card';
            card.setAttribute('data-category', ch.category);
            card.innerHTML = `<div class="logo-box"><img src="${ch.logo}"></div><span class="ch-title">${ch.title}</span>`;
            card.onclick = () => {
                if (ch.type === 'modern') switchToModern(ch.url);
                else if (ch.type === 'shaka' && ch.servers) loadShakaStream(ch.servers[0]);
                else openChannelModal(ch);
            };
            list.appendChild(card);
        });
    }

    window.filterChannels = function(cat, btn) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active-filter'));
        if (btn) btn.classList.add('active-filter');
        document.querySelectorAll('.channel-card').forEach(card => {
            card.style.display = (cat === 'all' || card.getAttribute('data-category') === cat) ? 'flex' : 'none';
        });
    };

    function initIframePlayer() {
        iframeEl = document.getElementById('iframePlayer');
        iframeLoader = document.getElementById('iframeLoader');
        if (iframeEl) {
            iframeEl.onload = () => { 
                if (iframeLoader) iframeLoader.style.display = 'none'; 
            };
        }
    }

    window.closeModal = () => document.getElementById('serverModal').style.display = 'none';

    window.addEventListener('DOMContentLoaded', () => {
        initShaka(); 
        initModernPlayer(); 
        initIframePlayer(); 
        loadChannels();
    });
</script>
</body>
</html>
